version: "1"

# Rafter policy for this repo.
#
# Every entry below is a VERIFIED false positive — each was traced to the actual
# source line before being suppressed. Do not add an entry here without doing the
# same. Suppressed findings are still recoverable: they appear in the `_suppressed`
# field of `rafter secrets --format json` and in `suppressed.json` for remote scans.

ignore:
  # npm lockfile `integrity` values are base64 sha512 digests. Three of them happen
  # to contain the substrings "aWs+", "AWSb" and "awsi", which trips the AWS key
  # pattern. Verified at package-lock.json lines 952, 2141 and 12444 — all three are
  # `"integrity": "sha512-..."` fields, not credentials.
  - paths: ["package-lock.json"]
    rules: ["AWS Secret Access Key", "AWS Access Key"]
    reason: "npm integrity sha512 digests matching the AWS key pattern by coincidence"

  # DEFAULT_AIRTABLE_BASE_ID ("app7...") and DEFAULT_AIRTABLE_TABLE_ID ("tbl9...")
  # are Airtable *object identifiers*, not credentials — they appear in every
  # Airtable URL. Real Airtable credentials are personal access tokens prefixed
  # "pat". Scoped to this one file so a genuine token committed elsewhere still
  # trips the rule.
  - paths: ["src/lib/services/fillout-sync.ts"]
    rules: ["airtable-api-key"]
    reason: "Airtable base/table IDs, not API keys — real Airtable tokens are pat-prefixed"

  # The Supabase config template ships commented guidance reading "DO NOT commit
  # your Twilio auth token to git. Use environment variable substitution instead:".
  # The scanner matches that advice text. The adjacent values already use the
  # env(...) form, so there is nothing to leak here.
  - paths: ["supabase/config.toml"]
    reason: "matches Supabase's own boilerplate 'DO NOT commit ...' comments; values already use env() substitution"

  # R-BFD19 / R-518DD / R-7729E — "Definition for rule '<x>' was not found".
  #
  # These ~500 findings are NOT code. Every flagged line is an eslint-disable
  # comment. There is no input, no sink, and nothing to exploit — the "finding"
  # is that ESLint could not resolve the rule NAMED IN THE COMMENT.
  #
  # That is a property of the scanner's environment, not this repo, and it was
  # tested rather than assumed. On 2026-08-06 the ESLint setup here was
  # modernised specifically to see whether it was the cause: eslint 8 -> 9,
  # .eslintrc.json -> flat config, and eslint-config-next moved from 14.2.21
  # (two majors behind) to ~16.2.12, making every referenced plugin resolve
  # explicitly instead of transitively. Locally the rules resolve and report
  # real violations. The Rafter count moved by exactly ZERO across that change
  # (515 -> 498, and the 17 were dead directives deleted in the same pass, not
  # rules resolving). Conclusion: the scanner runs its own ESLint without
  # installing this project's dependencies, so no change here can affect it.
  #
  # The only way to remove the comments themselves is to fix the underlying
  # `any` types. There are 2,753 of them repo-wide. That is a typing project,
  # not a security fix, and is tracked separately.
  - paths: ["src/**", "scripts/**"]
    rules:
      - "@typescript-eslint/no-explicit-any"
      - "@next/next/no-img-element"
      - "jsx-a11y/media-has-caption"
      - "@typescript-eslint/no-require-imports"
    reason: "scanner-side ESLint plugin resolution; flagged lines are eslint-disable comments, not code (verified 2026-08-06)"

